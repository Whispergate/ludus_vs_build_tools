---
- name: Check if .NET Framework 3.5 is already installed
  ansible.windows.win_shell: |
    $feature = Get-WindowsFeature NET-Framework-Core
    $feature.InstallState
  register: _dotnet35_state
  changed_when: false

- name: Enable .NET Framework 3.5 Windows feature
  ansible.windows.win_shell: |
    # The Windows Update service (wuauserv) must be running for DISM / Install-WindowsFeature
    # to fetch the .NET 3.5 payload. Ludus VMs ship with it disabled.
    $wuBefore = (Get-Service wuauserv).StartType
    if ($wuBefore -eq 'Disabled') {
      Set-Service wuauserv -StartupType Manual
      Start-Service wuauserv
    }
    try {
      # Try the SxS source first (present when the ISO is mounted or cached)
      $sxs = 'D:\sources\sxs'
      if (Test-Path $sxs) {
        Install-WindowsFeature NET-Framework-Core -Source $sxs -IncludeAllSubFeature
      } else {
        Install-WindowsFeature NET-Framework-Features, NET-Framework-Core -IncludeAllSubFeature
      }
    } finally {
      if ($wuBefore -eq 'Disabled') {
        Stop-Service wuauserv -Force -ErrorAction SilentlyContinue
        Set-Service wuauserv -StartupType Disabled
      }
    }
  when: _dotnet35_state.stdout | trim != 'Installed'
  async: 600
  poll: 15

- name: Ensure the VS Build Tools install directory exists
  # The VS installer's TargetDirCheck pre-check fails ("Installation folder
  # 'C:\BuildTools' could not be found", installer exit 8004) when a prior
  # instance is registered to this installPath but the folder was removed
  # (e.g. a half-completed earlier attempt). Creating it satisfies the check;
  # on a clean VM this is a harmless empty directory the installer fills.
  ansible.windows.win_file:
    path: "{{ ludus_vs_build_tools_install_dir }}"
    state: directory

- name: Install Visual Studio Build Tools via Chocolatey
  # Driving vs_buildtools.exe directly is unreliable: it is a self-extracting
  # bootstrapper that relaunches a detached child and exits immediately, so
  # Start-Process/WaitForExit races the real installer and returns a spurious
  # exit code 1 (with no dd_setup log). The Chocolatey package waits for the
  # real installer and treats VS installer exit codes (0/1605/1614/1641/3010)
  # correctly, including 3010 = reboot required.
  chocolatey.chocolatey.win_chocolatey:
    name: "visualstudio{{ ludus_vs_build_tools_version }}buildtools"
    state: present
    package_params: >-
      --installPath {{ ludus_vs_build_tools_install_dir }}
      {% for workload in ludus_vs_build_tools_workloads %}--add {{ workload }} {% endfor %}
      {% for component in ludus_vs_build_tools_components %}--add {{ component }} {% endfor %}
  register: vs_buildtools_install

- name: Install .NET SDK via Chocolatey
  chocolatey.chocolatey.win_chocolatey:
    name: "{{ ludus_dotnet_sdk_package }}"
    state: present

- name: Install NuGet CLI via Chocolatey
  chocolatey.chocolatey.win_chocolatey:
    name: nuget.commandline
    state: present

- name: Install .NET 4.0 reference assemblies via NuGet
  # No Chocolatey devpack exists for .NET Framework 4.0 (the base targeting
  # pack shipped only with Windows SDK v7.1 / VS 2010). The NuGet meta-package
  # drops reference assemblies where MSBuild expects them.
  ansible.windows.win_shell: |
    $refDir = "${env:ProgramFiles(x86)}\Reference Assemblies\Microsoft\Framework\.NETFramework\v4.0"
    if (Test-Path "$refDir\mscorlib.dll") {
      Write-Output "already installed"
      exit 0
    }
    nuget install Microsoft.NETFramework.ReferenceAssemblies.net40 -OutputDirectory $env:TEMP\refasm -NonInteractive
    $src = Get-ChildItem "$env:TEMP\refasm" -Directory -Filter "Microsoft.NETFramework.ReferenceAssemblies.net40*" |
      Select-Object -First 1
    if (-not $src) { throw "NuGet package not found after install" }
    $buildDir = Get-ChildItem $src.FullName -Directory -Filter "build" -Recurse | Select-Object -First 1
    $frameworkDir = Get-ChildItem $buildDir.FullName -Directory -Filter ".NETFramework" -Recurse | Select-Object -First 1
    $v40Dir = Get-ChildItem $frameworkDir.FullName -Directory -Filter "v4.0" | Select-Object -First 1
    if (-not $v40Dir) { throw "v4.0 directory not found in NuGet package" }
    if (-not (Test-Path $refDir)) { New-Item -ItemType Directory -Path $refDir -Force | Out-Null }
    Copy-Item "$($v40Dir.FullName)\*" $refDir -Recurse -Force
    Remove-Item "$env:TEMP\refasm" -Recurse -Force -ErrorAction SilentlyContinue
    Write-Output "installed"
  register: _net40_ref
  changed_when: _net40_ref.stdout | trim == 'installed'

- name: Install .NET Framework Developer Packs
  chocolatey.chocolatey.win_chocolatey:
    name: "{{ item }}"
    state: present
  loop: "{{ ludus_dotnet_framework_devpacks }}"

- name: Add VS Build Tools to system PATH
  ansible.windows.win_path:
    elements:
      - '{{ ludus_vs_build_tools_install_dir }}\MSBuild\Current\Bin'
      - '{{ ludus_vs_build_tools_install_dir }}\VC\Tools\MSVC'
    scope: machine
    state: present
